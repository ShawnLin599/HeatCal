<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="1120" viewBox="0 0 1390 1120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3B2D27" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 38px; font-weight: 700; fill: #24211F; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 17px; fill: #6E6560; }
      .screenName { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 18px; font-weight: 650; fill: #24211F; }
      .h1 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 24px; font-weight: 700; fill: #24211F; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 16px; font-weight: 650; fill: #24211F; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 13px; fill: #6E6560; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 11px; font-weight: 500; fill: #6E6560; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 11px; font-weight: 650; fill: #24211F; }
      .button { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 14px; font-weight: 650; fill: #FFFFFF; }
      .number { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 27px; font-weight: 750; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; letter-spacing: -0.2px; fill: #24211F; }
      .center { text-anchor: middle; dominant-baseline: middle; }
      .end { text-anchor: end; }
    </style>
  </defs>

  <rect width="1390" height="1120" fill="#F7EEE7"/>
  <circle cx="1280" cy="100" r="210" fill="#FF6B4A" opacity="0.08"/>
  <circle cx="100" cy="1040" r="240" fill="#2F7558" opacity="0.06"/>
  <text x="92" y="84" class="title">实际摄入调整 · 交互概念稿</text>
  <text x="92" y="118" class="subtitle">默认可直接保存 · 整餐一起调整 · 图标清晰度 v1.7</text>

  <!-- Screen 1 -->
  <text x="95" y="180" class="screenName">01 · 逐项调整</text>
  <g transform="translate(82 205)" filter="url(#shadow)">
