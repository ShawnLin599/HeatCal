    <rect x="8" y="8" width="354" height="744" rx="42" fill="#FFF8F2"/>
    <rect x="139" y="18" width="92" height="23" rx="12" fill="#24211F"/>
    <path d="M32 70 l-5 4 l5 4" fill="none" stroke="#6E6560" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="39" y="74" class="body" dominant-baseline="middle">返回</text>
    <text x="185" y="76" class="h2 center">调整实际摄入</text>

    <rect x="24" y="104" width="322" height="76" rx="20" fill="#FFFFFF" stroke="#F0E6DE"/>
    <text x="42" y="130" class="body">整餐汇总已更新</text>
    <text x="42" y="158" class="body" dominant-baseline="middle">约</text>
    <text x="62" y="153.5" class="number" dominant-baseline="middle">490</text>
    <text x="121" y="158" class="body" dominant-baseline="middle">千卡</text>
    <rect x="208" y="121" width="120" height="28" rx="14" fill="#DDF3E8"/>
    <text x="268" y="136" class="label center" fill="#2F7558">比识别少 130 千卡</text>

    <rect x="24" y="194" width="322" height="54" rx="18" fill="#FFFFFF" stroke="#E6D8CE"/>
    <circle cx="50" cy="221" r="13" fill="#F1E8E1"/>
    <path d="M43 216 h14 M43 221 h14 M43 226 h14" fill="none" stroke="#6E6560" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="48" cy="216" r="2.1" fill="#FFF8F2" stroke="#6E6560" stroke-width="1.1"/>
    <circle cx="54" cy="221" r="2.1" fill="#FFF8F2" stroke="#6E6560" stroke-width="1.1"/>
    <circle cx="46" cy="226" r="2.1" fill="#FFF8F2" stroke="#6E6560" stroke-width="1.1"/>
    <text x="70" y="215" class="label">整餐一起调整</text>
    <text x="70" y="235" class="small">会应用到全部食物，可再单独修改</text>
    <text x="326" y="225" class="small end">展开</text>

    <text x="24" y="278" class="h2">逐项实际摄入</text>
    <rect x="24" y="292" width="322" height="96" rx="18" fill="#FFFFFF" stroke="#F0E6DE"/>
    <circle cx="52" cy="322" r="15" fill="#F4D78E"/>
    <text x="78" y="317" class="label">鸡蛋</text>
    <text x="78" y="337" class="small">识别份量：2 个</text>
    <text x="326" y="337" class="small end">70 千卡</text>
    <text x="42" y="371" class="body">实际吃了</text>
    <rect x="120" y="351" width="34" height="30" rx="12" fill="#F1E8E1"/>
    <path d="M132 366 h10" fill="none" stroke="#24211F" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="160" y="351" width="74" height="30" rx="12" fill="#FFF1EC"/>
    <text x="197" y="367" class="label center" fill="#B83B25">1 个</text>
    <rect x="240" y="351" width="34" height="30" rx="12" fill="#F1E8E1"/>
    <path d="M252 366 h10 M257 361 v10" fill="none" stroke="#24211F" stroke-width="1.8" stroke-linecap="round"/>

    <rect x="24" y="400" width="322" height="96" rx="18" fill="#FFFFFF" stroke="#F0E6DE"/>
    <circle cx="52" cy="430" r="15" fill="#FFFFFF" stroke="#D8C9BD"/>
    <text x="78" y="425" class="label">米饭</text>
    <text x="78" y="445" class="small">识别份量：1 碗</text>
    <text x="42" y="484" class="body">实际摄入</text>
    <rect x="120" y="462" width="54" height="28" rx="12" fill="#FFF1EC"/>
    <text x="147" y="477" class="label center" fill="#B83B25">全部</text>
    <rect x="182" y="462" width="54" height="28" rx="12" fill="#FFF8F2" stroke="#E6D8CE"/>
    <text x="209" y="477" class="label center">半碗</text>
    <rect x="244" y="462" width="62" height="28" rx="12" fill="#FFF8F2" stroke="#E6D8CE"/>
    <text x="275" y="477" class="label center">自定义</text>
    <text x="326" y="436" class="small end">200 千卡</text>

    <rect x="24" y="508" width="322" height="96" rx="18" fill="#FFFFFF" stroke="#F0E6DE"/>
    <circle cx="52" cy="538" r="15" fill="#D86F45"/>
    <text x="78" y="533" class="label">宫保鸡丁</text>
    <text x="78" y="553" class="small">识别份量：1 份</text>
    <text x="42" y="592" class="body">实际摄入</text>
    <rect x="120" y="570" width="54" height="28" rx="12" fill="#FFF8F2" stroke="#E6D8CE"/>
    <text x="147" y="585" class="label center">全部</text>
    <rect x="182" y="570" width="54" height="28" rx="12" fill="#FFF1EC"/>
    <text x="209" y="585" class="label center" fill="#B83B25">1/2</text>
    <rect x="244" y="570" width="62" height="28" rx="12" fill="#FFF8F2" stroke="#E6D8CE"/>
    <text x="275" y="585" class="label center">自定义</text>
    <text x="326" y="544" class="small end">220 千卡</text>

    <rect x="24" y="618" width="322" height="42" rx="15" fill="#FFFFFF" stroke="#E6D8CE"/>
    <circle cx="48" cy="639" r="10" fill="#FFF1EC"/>
    <path d="M45 636 q3 -4 6 0 v4 q-3 4 -6 0 z M48 644 v3" fill="none" stroke="#B83B25" stroke-width="1.3" stroke-linecap="round"/>
    <text x="66" y="643" class="label" fill="#B83B25">文字 / 语音逐项修正</text>
    <rect x="24" y="674" width="322" height="52" rx="18" fill="#B83B25"/>
    <text x="185" y="701" class="button center">完成调整</text>
    <rect x="139" y="738" width="92" height="5" rx="3" fill="#24211F"/>
  </g>

  <!-- Screen 2 -->
  <text x="505" y="180" class="screenName">02 · 关键状态</text>
  <g transform="translate(492 205)" filter="url(#shadow)">
    <rect width="370" height="760" rx="48" fill="#24211F"/>
    <rect x="8" y="8" width="354" height="744" rx="42" fill="#FFF8F2"/>
    <rect x="139" y="18" width="92" height="23" rx="12" fill="#24211F"/>
    <path d="M32 70 l-5 4 l5 4" fill="none" stroke="#6E6560" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="39" y="74" class="body" dominant-baseline="middle">返回</text>
    <text x="185" y="76" class="h2 center">逐项调整状态</text>
    <text x="24" y="116" class="body">状态明确，但不阻止用户合理保存</text>

    <text x="24" y="154" class="h2">未食用</text>
    <rect x="24" y="168" width="322" height="106" rx="20" fill="#FFFFFF" stroke="#F0E6DE"/>
    <circle cx="52" cy="200" r="15" fill="#D86F45" opacity="0.35"/>
    <text x="78" y="196" class="label">宫保鸡丁</text>
    <text x="78" y="216" class="small">识别 1 份 · 实际未食用</text>
    <rect x="42" y="230" width="88" height="28" rx="12" fill="#F1E8E1"/>
    <text x="86" y="245" class="label center">0 千卡</text>
    <rect x="242" y="230" width="86" height="28" rx="12" fill="#FFF8F2" stroke="#E6D8CE"/>
    <text x="285" y="245" class="label center" fill="#6E6560">保留识别项</text>

    <text x="24" y="314" class="h2">超过识别份量</text>
    <rect x="24" y="328" width="322" height="128" rx="20" fill="#FFF1C7"/>
    <circle cx="52" cy="360" r="15" fill="#F4D78E"/>
    <text x="78" y="356" class="label">鸡蛋</text>
    <text x="78" y="376" class="small">识别 1 个 · 实际 2 个</text>
    <text x="42" y="408" class="label" fill="#795614">实际摄入超过识别份量，请确认</text>
    <rect x="42" y="418" width="126" height="30" rx="13" fill="#795614"/>
    <text x="105" y="433.5" class="button center" style="font-size:12px">确认按 2 个计入</text>
    <rect x="188" y="418" width="104" height="30" rx="13" fill="#FFF8F2" stroke="#E6D8CE"/>
    <text x="240" y="433.5" class="label center" fill="#795614">继续修改</text>

    <text x="24" y="496" class="h2">触发式澄清</text>
    <rect x="24" y="510" width="322" height="118" rx="20" fill="#FFFFFF" stroke="#F0E6DE"/>
    <circle cx="52" cy="542" r="15" fill="#FFF1EC"/>
    <path d="M47 542 h10 M52 537 v10" fill="none" stroke="#B83B25" stroke-width="1.8" stroke-linecap="round"/>
    <text x="78" y="538" class="label">需要澄清时再询问</text>
    <text x="78" y="558" class="small">仅在文字 / 语音无法定位目标时弹出 Sheet</text>
    <text x="42" y="590" class="body">用户选择目标项后，才应用实际摄入修正。</text>
    <text x="42" y="612" class="small">未选择前不会修改任何食物项。</text>
    <text x="185" y="686" class="body center">平时不打扰，只有需要选择时出现</text>
    <rect x="139" y="738" width="92" height="5" rx="3" fill="#24211F"/>
  </g>

  <!-- Screen 3 -->
  <text x="915" y="180" class="screenName">03 · 文字 / 语音与澄清 Sheet</text>
  <g transform="translate(902 205)" filter="url(#shadow)">
    <rect width="370" height="760" rx="48" fill="#24211F"/>
    <rect x="8" y="8" width="354" height="744" rx="42" fill="#FFF8F2"/>
    <rect x="139" y="18" width="92" height="23" rx="12" fill="#24211F"/>
    <path d="M32 70 l-5 4 l5 4" fill="none" stroke="#6E6560" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="39" y="74" class="body" dominant-baseline="middle">返回</text>
    <text x="185" y="76" class="h2 center">修正实际摄入</text>

    <rect x="24" y="108" width="322" height="104" rx="20" fill="#FFFFFF" stroke="#E6D8CE"/>
    <text x="42" y="136" class="body">你可以说或输入：</text>
    <text x="42" y="168" class="h2">“鸡蛋吃了一个，米饭全部吃完。”</text>
    <circle cx="306" cy="188" r="14" fill="#FFF1EC"/>
    <path d="M302 183 q4 -5 8 0 v5 q-4 5 -8 0 z M306 193 v4" fill="none" stroke="#B83B25" stroke-width="1.6" stroke-linecap="round"/>

    <text x="24" y="252" class="h2">将应用 2 项调整</text>
    <rect x="24" y="266" width="322" height="92" rx="20" fill="#FFFFFF" stroke="#F0E6DE"/>
    <circle cx="52" cy="298" r="15" fill="#F4D78E"/>
    <text x="78" y="294" class="label">鸡蛋</text>
    <text x="78" y="314" class="small">识别 2 个 → 实际 1 个</text>
    <rect x="250" y="282" width="78" height="28" rx="12" fill="#DDF3E8"/>
    <text x="289" y="297" class="label center" fill="#2F7558">−70 千卡</text>
    <text x="42" y="346" class="small">解析结果可在应用前修改</text>

    <rect x="24" y="370" width="322" height="92" rx="20" fill="#FFFFFF" stroke="#F0E6DE"/>
    <circle cx="52" cy="402" r="15" fill="#FFFFFF" stroke="#D8C9BD"/>
    <text x="78" y="398" class="label">米饭</text>
    <text x="78" y="418" class="small">识别 1 碗 → 实际全部</text>
    <rect x="250" y="386" width="78" height="28" rx="12" fill="#F1E8E1"/>
    <text x="289" y="401" class="label center">不变</text>
    <text x="42" y="450" class="small">未提及的食物项保持当前实际摄入量</text>

    <rect x="8" y="504" width="354" height="248" rx="30" fill="#FFFFFF" stroke="#E6D8CE"/>
    <rect x="151" y="520" width="68" height="5" rx="3" fill="#E6D8CE"/>
    <text x="24" y="562" class="h2">请选择要修改的米饭</text>
    <text x="24" y="586" class="small">你说“米饭吃了一半”，存在 2 个候选</text>
    <rect x="24" y="604" width="322" height="44" rx="15" fill="#FFF8F2" stroke="#E6D8CE"/>
    <text x="42" y="631" class="label">白米饭 · 照片左侧 · 1 碗</text>
    <circle cx="320" cy="626" r="8" fill="#FFFFFF" stroke="#D8C9BD"/>
    <rect x="24" y="654" width="322" height="44" rx="15" fill="#FFF8F2" stroke="#E6D8CE"/>
    <text x="42" y="681" class="label">炒饭 · 照片右侧 · 1 份</text>
    <circle cx="320" cy="676" r="8" fill="#FFFFFF" stroke="#D8C9BD"/>
    <text x="185" y="714" class="label center" fill="#B83B25">取消，不应用本次修正</text>
    <rect x="139" y="738" width="92" height="5" rx="3" fill="#24211F"/>
  </g>

  <text x="92" y="1030" class="h2">规则提示</text>
  <text x="176" y="1030" class="body">整餐汇总始终等于各食物项当前实际营养值之和；默认主路径不增加强制确认。</text>
  <text x="1120" y="1030" class="small">CAL-20260613-003 · Actual Intake UI v1.7</text>
</svg>
